<style>
  /* Services-specific */
  .svc-list { display: grid; grid-template-columns: 1fr; gap: 0; }
  .svc-row {
    display: grid;
    grid-template-columns: 88px 1fr 1.4fr 200px;
    gap: 32px;
    align-items: start;
    padding: 36px 0;
    border-top: 1px solid var(--border);
  }
  .svc-row:last-child { border-bottom: 1px solid var(--border); }
  .svc-row .svc-num {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: calc(13px * var(--text-scale, 1));
    color: var(--cyan);
    letter-spacing: 0.06em;
    padding-top: 8px;
  }
  .svc-row h3 {
    font-size: calc(22px * var(--text-scale, 1));
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .svc-row .svc-tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
  }
  .svc-row .svc-tag {
    font-size: calc(11px * var(--text-scale, 1));
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 3px 8px;
    border: 1px solid var(--border);
  }
  .svc-row p {
    color: var(--muted);
    font-size: calc(14.5px * var(--text-scale, 1));
    line-height: 1.65;
    margin: 0 0 12px;
  }
  .svc-row ul {
    margin: 8px 0 0;
    padding-left: 18px;
    color: var(--muted);
    font-size: calc(13.5px * var(--text-scale, 1));
    line-height: 1.7;
  }
  .svc-row .svc-meta { font-size: calc(13px * var(--text-scale, 1)); color: var(--navy); }
  .svc-row .svc-meta strong { color: var(--cyan); font-weight: 700; display: block; font-size: calc(12px * var(--text-scale, 1)); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .svc-row .svc-meta + .svc-meta { margin-top: 14px; }

  .panels {
    background: var(--bg);
    padding: 64px 0;
    margin-top: 64px;
    border-top: 1px solid var(--border);
  }
  .panels h2 {
    font-size: calc(28px * var(--text-scale, 1));
    color: var(--navy); font-weight: 700; margin: 0 0 8px;
  }
  .panels .lede { color: var(--muted); font-size: calc(15px * var(--text-scale, 1)); max-width: none; margin: 0 0 32px; line-height: 1.6; }
  .panel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .panel-card {
    border: 1px solid var(--border);
    padding: 28px 26px 30px;
    background: var(--white);
    transition: all .15s;
  }
  .panel-card:hover { background: var(--white); border-color: var(--cyan); }
  .panel-card h4 { margin: 0 0 10px; font-size: calc(18px * var(--text-scale, 1)); color: var(--navy); font-weight: 700; letter-spacing: -0.005em; }
  .panel-card .panel-num { font-family: ui-monospace, monospace; font-size: calc(12px * var(--text-scale, 1)); color: var(--cyan); letter-spacing: 0.08em; font-weight: 700; margin-bottom: 8px; }
  .panel-card .panel-icon { width: 56px; height: 56px; margin-bottom: 18px; display: block; }
  .panel-card .panel-icon img, .panel-card .panel-icon svg { width: 100%; height: 100%; display: block; }
  .panel-card a.panel-cta { margin-top: 20px; color: var(--navy); }
  .panel-card a.panel-cta svg { color: var(--cyan); }
  .panel-card a.panel-cta:hover { color: var(--navy); }
  .panel-card a.panel-cta:hover svg { color: var(--white); }
  .btn-faq { color: var(--navy); }
  .btn-faq:hover { color: var(--white); }
  .panel-card p { margin: 8px 0 0; font-size: calc(14px * var(--text-scale, 1)); color: var(--muted); line-height: 1.65; }
  .panel-card a { color: var(--cyan); font-weight: 600; text-decoration: none; }
  .panel-card a:hover { color: var(--navy); }

  @media (max-width: 860px) {
    .svc-row { grid-template-columns: 1fr; gap: 12px; padding: 28px 0; }
    .svc-row .svc-num { padding-top: 0; }
    .panel-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
